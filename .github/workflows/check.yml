name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-repository.py
      - run: python3 -m pip install -r requirements-check.txt
      - run: python3 -m unittest discover -s weights -p 'test_placement.py'
      - run: bash -n runtime/vllm/node.sh
